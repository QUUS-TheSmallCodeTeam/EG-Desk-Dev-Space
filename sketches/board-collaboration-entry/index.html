function start(kind){
 const peers=kind==='create'?['min','seo']:kind==='share'?['min','jiu']:['jiu'];
 const displays=Object.fromEntries(peers.map(p=>[p,{panel:'none',focus:'own',placed:false}]));
 if(kind==='share')displays.min={panel:'none',focus:'shared',placed:true};
 return {kind,peers,p:peers[0],displays,created:kind!=='create',pending:kind==='invite',members:kind==='share'?{min:true}:['return','manage'].includes(kind)?{jiu:true}:{},released:false,revoked:false,fail:false,confirmed:false,claimed:false,draft:null,receipt:null,msg:''};
}
function change(s,a){
 const p=s.p,n={...s,displays:{...s.displays},members:{...s.members},msg:''},v={...s.displays[p]};n.displays[p]=v;
 const may=()=>access(s,p); const enter=()=>{v.panel='none';v.focus='shared';v.placed=true;};
 switch(a){
 case 'other':if(s.peers.length!==2)return s;n.p=s.peers.find(x=>x!==p);break;
 case 'boards':v.panel='picker';break;
 case 'own':v.panel='none';v.focus='own';break;
 case 'new':if(v.panel!=='picker'||s.kind!=='create'||p!=='min'||s.pending||s.created)return s;v.panel='new';break;
 case 'compose':if(v.panel!=='new')return s;v.panel='proposal';break;
 case 'menu':if(v.focus!=='shared'||!may()||p!=='min')return s;v.panel='menu';break;
 case 'share':if(v.panel!=='menu'||p!=='min'||s.kind!=='share'||s.pending||s.members.jiu)return s;v.panel='share';break;
 case 'preview':if(v.panel!=='share'&&v.panel!=='proposal')return s;v.panel='preview';break;
 case 'send':if(v.panel!=='preview'||p!=='min'||s.pending)return s;n.pending=true;v.panel='sent';n.msg='발송한 사람의 화면 위치는 그대로입니다.';break;
 case 'notice':if(!s.pending||p==='min'||s.revoked)return s;v.panel='notice';break;
 case 'review':if(v.panel!=='notice'||!s.pending||p==='min'||s.revoked)return s;v.panel='scope';break;
 case 'accept':if(v.panel!=='scope'||!s.pending||p==='min'||s.revoked)return s;n.pending=false;n.created=true;n.members[p]=true;if(s.kind==='create')n.members.min=true;if(s.fail){v.panel='failure';n.msg='수락은 저장됐지만 첫 화면을 열지 못했습니다.';}else{enter();n.msg='참여가 확인되어, 이 기기에서만 공용 보드를 열었습니다.';}break;
 case 'decline':if(v.panel!=='scope'||!s.pending||s.revoked)return s;n.pending=false;v.panel='none';n.msg='거절했습니다. 원래 보던 자리는 그대로입니다.';break;
 case 'fail':if(v.panel!=='scope'||p==='min')return s;n.fail=!s.fail;break;
 case 'check':if(v.panel!=='failure'||!may())return s;n.confirmed=true;v.panel='checked';break;
 case 'retry':if(v.panel!=='checked'||!s.confirmed||!may())return s;enter();n.msg='기존 수락을 확인하고 같은 보드를 열었습니다.';break;
 case 'settings':v.panel='settings';break;
 case 'manage':if(v.panel!=='settings')return s;v.panel='manage';break;
 case 'received':if(v.panel!=='manage')return s;v.panel='received';break;
 case 'item':if(v.panel!=='received'||!may()||p==='min')return s;v.panel='item';break;
 case 'open':if(v.panel!=='item'||!may())return s;enter();break;
 case 'pick':if(!may()||!['picker','none','sent'].includes(v.panel))return s;enter();break;
 case 'local':if(s.kind!=='local'||!['picker','none'].includes(v.panel))return s;v.focus='local';v.placed=true;v.panel='none';break;
 case 'close':if(!v.placed)return s;v.placed=false;v.focus='own';v.panel='none';n.msg='내 Canvas의 보드 영역을 닫았습니다. 멤버에서 나간 것이 아닙니다.';break;
 case 'dismiss':v.panel='none';break;
 case 'release':if(p!=='jiu'||!may()||v.focus!=='shared'||s.released)return s;n.released=true;n.msg='연습: 민재가 지우에게 배송 카드만 공개했습니다.';break;
 case 'claim':if(p!=='jiu'||!may()||!s.released||s.claimed||v.focus!=='shared')return s;n.claimed=true;break;
 case 'record':if(p!=='jiu'||!may()||!s.released||!s.claimed||s.receipt||v.focus!=='shared')return s;v.panel='record';break;
 case 'ready':case 'waiting':if(v.panel!=='record'||p!=='jiu'||!may()||!s.released||!s.claimed||s.receipt)return s;n.draft=a==='ready'?'집하 준비됨':'집하 대기';v.panel='draft';break;
 case 'draft':if(p!=='jiu'||!may()||!s.released||!s.draft||s.receipt)return s;v.panel='draft';break;
 case 'reply':if(p!=='jiu'||!may()||!s.released||!s.draft||s.receipt||v.panel!=='draft')return s;n.receipt=s.draft;v.panel='none';break;
 case 'revoke':if(p!=='jiu'||!s.members[p]||s.revoked)return s;n.revoked=true;n.members[p]=false;n.released=false;n.claimed=false;n.draft=null;v.panel='none';v.focus='own';v.placed=false;n.msg='연습: 지우 기기에 접근 회수가 적용됐습니다.';break;
 default:return s;
 }return n;
}

function access(s,p){return !!(s.created&&s.members[p]&&!(p==='jiu'&&s.revoked));}
// Scene presets replay distinct invitation, acceptance, and sender publication events.
function sceneStart(id){
 if(id==='work'||id==='visit'){let s=start('invite');for(const action of ['notice','review','accept','release'])s=change(s,action);if(id==='visit')s=change(s,'close');return {...s,msg:''};}

}
</script><script id="desk-space">// Local working positions in a synthetic Desk. Sharing is decided elsewhere.
function createDeskSpace(){
  // A reproducible set-down, not a device layout or random jitter. Two personal
  // papers were already here before the shipping slip was brought to the front.
  const objects={board:{x:658,y:243,w:0,z:0},packet:{x:591,y:284,w:350,z:4},note:{x:426,y:228,w:204,z:2},log:{x:816,y:523,w:248,z:1},reply:{x:0,y:0,w:262,z:3}};
  return {objects,history:[],openedReply:false,logOpen:false,front:'packet',lastBoard:null};
}
function liftItem(d,k){if(!Object.hasOwn(d.objects,k)||k==='board')return;const a=d.objects[k],top=Math.max(...Object.values(d.objects).map(i=>i.z));if(a.z!==top)a.z=top+1;d.front=k;}
function placeItem(d,k,x,y){if(!d.objects[k]||!Number.isFinite(x)||!Number.isFinite(y))return;d.objects[k].x=x;d.objects[k].y=y;}
function moveSet(d,k,dx,dy){if(!Number.isFinite(dx)||!Number.isFinite(dy)||!d.objects[k])return;for(const item of k==='board'?['board','packet']:[k]){const b=d.objects[item];placeItem(d,item,b.x+dx,b.y+dy);}}
function trackStart(d,k){if(!d.objects[k])return null;return {k,x:d.objects[k].x,y:d.objects[k].y};}
function trackEnd(d,begin){if(!begin)return;const a=d.objects[begin.k],dx=a.x-begin.x,dy=a.y-begin.y;if(!dx&&!dy)return;d.history.push({k:begin.k,dx,dy});if(d.history.length>32)d.history.shift();}
function undoPlace(d,available){while(d.history.length){const t=d.history.pop();if(available(t.k)){moveSet(d,t.k,-t.dx,-t.dy);return t.k;}}return null;}
function unfoldReply(d){if(!d.openedReply){const p=d.objects.packet;placeItem(d,'reply',p.x+181,p.y+117);d.openedReply=true;}liftItem(d,'reply');}
function noSharedGeometry(d){d.history=d.history.filter(a=>a.k==='note'||a.k==='log');d.lastBoard=null;d.openedReply=false;if(!['note','log'].includes(d.front))d.front='note';}
function screenToWorldDelta(dx,dy,zoom){if(!Number.isFinite(zoom)||zoom<=0)return {x:0,y:0};return {x:dx/zoom,y:dy/zoom};}
// Moving the camera never writes back to document coordinates or scale.
function revealItem(cam,p,rect,safe){
  const left=cam.x+p.x*cam.z,top=cam.y+p.y*cam.z,w=rect.w*cam.z,h=rect.h*cam.z;
  const delta=(lo,len,min,max)=>len>max-min?min-lo:lo<min?min-lo:lo+len>max?max-(lo+len):0;
  return {x:cam.x+delta(left,w,safe.left,safe.right),y:cam.y+delta(top,h,safe.top,safe.bottom),z:cam.z};
}
</script><script id="entry-ui">'use strict';
const $=id=>document.getElementById(id),names={jiu:'지우',min:'민재',seo:'서윤'};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=k=>`<svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-${k}"></use></svg>`;
const button=(label,key,cls='',symbol='',attrs='')=>`<button type="button" data-act="${key}" class="${cls}" ${attrs}>${symbol?icon(symbol):''}${esc(label)}</button>`;
const ctrl=(label,key,symbol,cls='',pressed)=>`<button type="button" class="${cls}" data-act="${key}" aria-label="${label}" title="${label}"${pressed===undefined?'':` aria-pressed="${pressed}"`}>${icon(symbol)}</button>`;
const option=(label,key,symbol,badge='')=>`<button type="button" data-act="${key}" class="option">${icon(symbol)}${esc(label)}${badge?`<em>${esc(badge)}</em>`:''}</button>`;
function barcode(){const bits={'*':0x094,S:0x046,H:0x10c,'-':0x085,'4':0x031,'2':0x061};let x=0,body='';for(const c of '*SH-42*'){for(let i=8;i>=0;i--){const w=bits[c]>>i&1?3:1;if(i%2===0)body+=`<rect x="${x}" width="${w}" height="12"/>`;x+=w;}x++;}return `<svg class="scan" viewBox="0 0 ${x} 12" preserveAspectRatio="none" aria-hidden="true">${body}</svg>`;}
const nodeIds={board:'board',packet:'packet',note:'private',log:'journal',reply:'answer'};

const spaces={},cameras={},writings={};let cam={x:0,y:0,z:1};

function handle(k,label,end='',glyph=''){return `<div data-move="${k}" class="grabline" tabindex="0" role="button" aria-label="${label} 이동, 화살표 키로 위치 조정" title="끌어서 위치 이동 · 화살표로 조정"><span class="grabmark" aria-hidden="true">⠿</span>${glyph?icon(glyph):''}<span>${label}</span><small>${end}</small></div>`;}
function transform(smooth=false){$('world').classList.toggle('ease',smooth);$('world').style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;cameras[s.p]={...cam};const z=$('zoom').querySelector('.zoomnumber');if(z)z.textContent=Math.round(cam.z*100)+'%';}
function layout(){const d=space();for(const k of Object.keys(nodeIds)){const o=obj(k),el=dom(k);el.style.left=o.x+'px';el.style.top=o.y+'px';if(o.w)el.style.width=o.w+'px';el.style.zIndex=k==='board'?1:String(o.z+2);el.toggleAttribute('data-top',k===d.front);}const e=$('extent');e.hidden=$('board').hidden;const b=obj('board'),p=obj('packet');const ax=Math.min(b.x-14,p.x-24),ay=Math.min(b.y-14,p.y-24);e.style.cssText=`left:${ax}px;top:${ay}px;width:${Math.max(b.x+164,p.x+p.w+24)-ax}px;height:${Math.max(b.y+40,p.y+dom('packet').offsetHeight+24)-ay}px`;}
function lift(k){if(!onDesk(k)||k==='board')return;liftItem(space(),k);layout();}
function initialView(k,animate=false){const el=dom(k);if(!onDesk(k))return;const r=safeRect(),p=obj(k),vw=$('stage').clientWidth,vh=$('stage').clientHeight;

  cam={x:tx-p.x*z,y:ty-p.y*z,z};transform(animate);}
function bring(k,smooth=true,raise=true){if(!onDesk(k))return;if(raise)lift(k);const el=dom(k);cam=revealItem(cam,obj(k),{w:el.offsetWidth,h:el.offsetHeight},safeRect());transform(smooth);}

function zoomBy(delta){const v=$('stage'),cx=v.clientWidth/2,cy=v.clientHeight/2,n=Math.max(.48,Math.min(1.75,+(cam.z+delta).toFixed(2)));cam={x:cx-(cx-cam.x)*n/cam.z,y:cy-(cy-cam.y)*n/cam.z,z:n};transform();}
function slip(){const mine=s.draft&&!s.receipt;const act=mine?'draft':s.claimed?'record':'claim',verb=mine?'회신 쪽지 열기':s.claimed?'상태 적기':'이 일 맡기';return `<article class="waybill" id="slip" aria-label="배송 요청서">${handle('packet','배송 요청서','민재가 건넴','file')}<div class="way-body"><div class="way-header"><div><span class="fine">운송 참조</span><div class="way-code">SH-42</div></div><span class="printmark" aria-hidden="true">${icon('box')}</span></div><div class="dashcut"></div><h2>집하 상태 확인</h2><p>${s.receipt?'보낸 상태: '+esc(s.receipt):mine?'회신 전인 쪽지가 있습니다.':'집하할 준비가 됐는지 확인 부탁해요.'}</p><div class="sender">민재 <i>→</i> 지우</div></div><div class="way-tear"><div class="barcode-block">${barcode()}<small>SH-42</small></div>${s.receipt?'<b class="sentmark">회신 보냄</b>':button(verb,act,'workaction',''+(mine?'mail':s.claimed?'note':'arrow'))}</div></article>`;}
function flatCard(label,h,copy){return `<article class="workleaf">${handle('packet',label,'','file')}<div><h2>${h}</h2><p>${copy}</p></div></article>`;}
function drawBoard(){const v=stateView(),local=s.kind==='local',owner=s.p==='min'&&s.kind==='share';const show=!!(v.placed&&(may()||local));const b=$('board'),card=$('packet');b.hidden=card.hidden=!show;if(!show){b.replaceChildren();card.replaceChildren();return;}b.innerHTML=`<div class="tag-inner">${icon(local?'board':'people')}<h1 id="board-title" tabindex="-1">${local?'자료 정리':'출고 협업'}</h1><small>${local?'개인':'공용'}</small>${ctrl('보드 메뉴','boardMenu','more','iconbutton')}</div>`;card.innerHTML=local?flatCard('문서','회의 메모','직접 저장한 회의 준비 메모입니다.'):owner?(s.receipt?flatCard('받은 쪽지','지우의 회신','SH-42 · '+esc(s.receipt)):flatCard('업무 메모','오늘 출고 준비','보드 이름 옆 메뉴에서 지우를 초대할 수 있어요.')):s.p==='jiu'&&s.released?slip():`<div class="no-work"><strong>아직 공개된 업무가 없어요.</strong><p>내게 공개한 자료만 이 자리에 놓입니다.</p></div>`;}

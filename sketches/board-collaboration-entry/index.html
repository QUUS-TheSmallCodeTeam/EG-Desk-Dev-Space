case 'checked':cap='받은 초대';head='참여 확인됨';body=desc('출고 협업을 이 Desk에서 다시 열 수 있습니다.')+group(primary('공유 대상 다시 열기','retry'));break;
case 'settings':cap=names[p]+'의 Desk';head='설정';body=option('공유 관리','manage','people');break;

default:if(box.open)box.close();return;}
$('sheet-caption').textContent=cap;$('sheet-body').innerHTML=title(head)+body;box.classList.toggle('pop',pop);if(!box.open){focusedBefore=document.activeElement;box.showModal();}if(kind==='search')$('q').focus({preventScroll:true});else $('sheet-title').focus({preventScroll:true});}

function action(k){if(!k)return;if(k.startsWith('scene:'))return switchCase(k.slice(6));if(k.startsWith('tick')){const n=Number(k.slice(4));noteTicks[s.p][n]=!noteTicks[s.p][n];drawNote();$('private').querySelector(`[data-act="tick${n}"]`).focus({preventScroll:true});return;}switch(k){case 'home':return go('own');case 'quick':if(!permittedBoard())return;if(!['none','picker','sent'].includes(stateView().panel))s=change(s,'dismiss');return go('pick');case 'boardMenu':return showOverlay(k);case 'beginShare':s=change(s,'menu');return go('share');case 'newFromRail':s=change(s,'boards');return go('new');case 'notifications':return s.pending&&s.p!=='min'&&!s.revoked?go('notice'):showOverlay(k);case 'inviteFromNotice':s=change(s,'notice');return go('review');case 'extras':case 'files':case 'search':return showOverlay(k);case 'closeSheet':return clearDialog();case 'zoomOut':return zoomBy(-.1);case 'zoomIn':return zoomBy(.1);case 'pointer':case 'hand':panMode=k==='hand';return shell();case 'fit':return fit('auto');case 'other':oldCam=cameras[s.peers.find(p=>p!==s.p)];return go('other');default:return go(k);}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)action(a.dataset.act);});
$('brand').onclick=()=>action('boards');$('search').onclick=()=>action('search');$('bell').onclick=()=>action('notifications');$('profile').onclick=()=>action('settings');$('extras').onclick=()=>action('extras');$('sheet-x').onclick=clearDialog;$('sheet').addEventListener('cancel',e=>{e.preventDefault();clearDialog();});$('sheet').addEventListener('click',e=>{if(e.target!==$('sheet'))return;const r=$('sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)clearDialog();});document.addEventListener('input',e=>{if(e.target.id==='q')$('matches').innerHTML=boardRows(e.target.value.trim());});
const lim=(n,min,max)=>Math.min(max,Math.max(min,n));
$('stage').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,input'))return;const move=e.target.closest('[data-move]'),onPaper=e.target.closest('.paper,.notepaper');if(onPaper&&!move&&!panMode)return;const part=!panMode&&move?move.dataset.move:'pan',pt=part==='pan'?{x,y}:deskPos()[part];drag={id:e.pointerId,part,atX:e.clientX,atY:e.clientY,sx:pt.x,sy:pt.y};$('world').classList.remove('ease');$('stage').setPointerCapture(e.pointerId);$('stage').classList.add('dragging');});$('stage').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.atX,dy=e.clientY-drag.atY;if(drag.part==='pan'){x=drag.sx+dx;y=drag.sy+dy;transform();}else if(dx||dy){const d=deskPos();d[drag.part]={x:lim(drag.sx+dx/z,-6000,6000),y:lim(drag.sy+dy/z,-6000,6000)};d.moved=true;place();}});function finishDrag(e){if(!drag||drag.id!==e.pointerId)return;drag=null;$('stage').classList.remove('dragging');}for(const k of ['pointerup','pointercancel','lostpointercapture'])$('stage').addEventListener(k,finishDrag);$('stage').addEventListener('wheel',e=>{if($('sheet').open)return;e.preventDefault();if(e.ctrlKey||e.metaKey)zoomBy(e.deltaY<0?.1:-.1);else{x-=e.deltaX;y-=e.deltaY;transform();}},{passive:false});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showOverlay('search');return;}if($('sheet').open||document.activeElement!==$('stage'))return;const d={ArrowLeft:[40,0],ArrowRight:[-40,0],ArrowUp:[0,40],ArrowDown:[0,-40]}[e.key];if(d){e.preventDefault();x+=d[0];y+=d[1];transform();}});let w0=0,h0=0;new ResizeObserver(()=>{const w=$('stage').clientWidth,h=$('stage').clientHeight;if(w===w0&&h===h0)return;w0=w;h0=h;setDefaults();fit('auto',false);}).observe($('stage'));redraw('auto',false);

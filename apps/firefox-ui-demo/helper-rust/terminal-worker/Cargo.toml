[package]
name = "egdesk-terminal-worker"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately independent from the experimental helper-rust application.
[workspace]

[[bin]]
name = "egdesk-terminal-worker"
path = "src/main.rs"

[dependencies]
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EG-Desk Terminal</title>
  <link rel="stylesheet" href="chrome://userchrome/content/vendor/xterm.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1a2e;
      overflow: hidden;
    }
    #terminal-container {
      width: 100%; height: 100%;
      padding: 4px;
    }
    #terminal-container .xterm {
      height: 100%;
    }
    /* Status overlay */
    #status-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-family: monospace;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    #status-overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="status-overlay">Connecting...</div>
  <div id="terminal-container"></div>

  <script src="chrome://userchrome/content/vendor/xterm.min.js"></script>
  <script src="chrome://userchrome/content/vendor/addon-fit.min.js"></script>
  <script src="chrome://userchrome/content/vendor/addon-web-links.min.js"></script>
  <script>
  'use strict';
  (async () => {
    const { createTerminalCloseController } = await import('chrome://userchrome/content/EGDeskTerminalState.sys.mjs');
    const HELPER_PORT = 39218;
    const HELPER_ORIGIN = `http://127.0.0.1:${HELPER_PORT}`;
    const statusEl = document.getElementById('status-overlay');
    const containerEl = document.getElementById('terminal-container');

    // ---- xterm.js setup ----
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'bar',
      fontSize: 13,
      fontFamily: '"JetBrains Mono", "Fira Code", "SF Mono", Menlo, Monaco, "Courier New", monospace',
      theme: {
        background: '#1a1a2e',
        foreground: '#e0e0e0',
        cursor: '#f8f8f2',
        selectionBackground: 'rgba(248,248,242,0.2)',
        black: '#21222c',
        red: '#ff5555',
        green: '#50fa7b',
        yellow: '#f1fa8c',
        blue: '#bd93f9',
        magenta: '#ff79c6',
        cyan: '#8be9fd',
        white: '#f8f8f2',
        brightBlack: '#6272a4',
        brightRed: '#ff6e6e',
        brightGreen: '#69ff94',
        brightYellow: '#ffffa5',
        brightBlue: '#d6acff',
        brightMagenta: '#ff92df',
        brightCyan: '#a4ffff',
        brightWhite: '#ffffff',
      },
      allowProposedApi: true,
      scrollback: 5000,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    if (typeof WebLinksAddon !== 'undefined') {
      term.loadAddon(new WebLinksAddon.WebLinksAddon());
    }

    term.open(containerEl);

    // Initial fit
    requestAnimationFrame(() => {
      fitAddon.fit();
      connectBridge();
    });

    // ---- HTTP PTY bridge ----
    let ptyId = null;
    let readTimer = null;
    let connected = false;
    let exitConfirmed = false;
    let closeRequested = false;

    async function postTerminal(path, body, options = {}) {
      const controller = options.timeoutMs ? new AbortController() : null;
      const timeout = controller ? setTimeout(() => controller.abort(), options.timeoutMs) : null;
      try {
        const response = await fetch(`${HELPER_ORIGIN}${path}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {}), ...(controller ? { signal: controller.signal } : {}),
        });
        const result = await response.json().catch(() => ({}));
        if (options.allowGone && path === '/terminal/read' && [400, 404].includes(response.status)
            && result.error === 'Session not found' && result.exited === true) return result;
        if (!response.ok || result.error) throw new Error(result.error || `HTTP ${response.status}`);
        return result;
      } finally { if (timeout) clearTimeout(timeout); }
    }

    function stopPolling() {
      if (readTimer) {
        clearInterval(readTimer);
        readTimer = null;
      }
    }

    function showDisconnected(message) {
      if (closeRequested) { renderCloseState({ phase: 'offline', error: message }); return; }
      statusEl.textContent = message || 'Disconnected. Click to reconnect.';
      statusEl.classList.remove('hidden');
      statusEl.style.pointerEvents = 'auto';
      statusEl.style.cursor = 'pointer';
      statusEl.onclick = () => {
        statusEl.style.pointerEvents = 'none';
        statusEl.style.cursor = 'default';
        statusEl.onclick = null;
        connectBridge();
      };
    }

    async function readTerminalOutput() {
      if (!ptyId || !connected) return;
      try {
        const result = await postTerminal('/terminal/read', { sessionId: ptyId });
        if (result.data) term.write(result.data);
        if (result.exited) {
          exitConfirmed = true;
          term.write(`\r\n\x1b[90m[Process exited with code ${result.exitCode ?? ''}]\x1b[0m\r\n`);
          connected = false;
          ptyId = null;
          stopPolling();
          notifyTerminalExit();
        }
      } catch (e) {
        if (closeRequested) return; // The bounded close controller is still observing this same PTY.
        connected = false;
        stopPolling();
        showDisconnected(`Disconnected. ${e.message || 'Click to reconnect.'}`);
      }
    }

    function notifyTerminalExit() {
      try { window.parent.postMessage({ type: 'terminal-exit-confirmed' }, '*'); } catch {}
    }

    function renderCloseState(closeState) {
      statusEl.classList.remove('hidden');
      statusEl.textContent = closeState.phase === 'confirmed'
        ? '터미널 세션 종료 확인됨'
        : closeState.phase === 'offline' ? '연결이 끊겨 종료 여부를 확인하지 못했습니다.'
        : closeState.phase === 'timeout' ? '아직 실행 종료가 확인되지 않았습니다.' : '터미널 종료 확인 중…';
      statusEl.style.pointerEvents = 'none';
      statusEl.onclick = null;
      if (closeState.phase === 'offline' || closeState.phase === 'timeout') {
        const retry = document.createElement('button');
        retry.textContent = '종료 상태 다시 확인';
        retry.setAttribute('aria-label', '터미널 종료 상태 다시 확인');
        retry.dataset.testid = 'terminal-close-retry';
        retry.style.cssText = 'display:block;margin:10px auto;padding:6px 10px;pointer-events:auto;';
        retry.onclick = () => { void closeForBoard(); };
        statusEl.appendChild(retry);
      }
    }

    const terminalCloser = createTerminalCloseController({
      requestKill: sessionId => postTerminal('/terminal/kill', { sessionId }, { timeoutMs: 1500 }),
      readStatus: sessionId => postTerminal('/terminal/read', { sessionId }, { timeoutMs: 1500, allowGone: true }),
      onOutput: data => term.write(data),
      onState: closeState => {
        renderCloseState(closeState);
        if (closeState.phase === 'confirmed') {
          exitConfirmed = true;
          connected = false;
          ptyId = null;
          stopPolling();
          notifyTerminalExit();
        }
      },
    });

    async function closeForBoard() {
      if (exitConfirmed) return true;
      if (!ptyId) return false;
      closeRequested = true;
      // Replace normal output polling with a bounded observation loop; a kill ACK
      // alone never resolves the close. No spawn or command replay occurs on retry.
      stopPolling();
      return terminalCloser.close(ptyId);
    }

    // 키 입력은 keystroke마다 개별 HTTP POST로 나가므로, 직렬화하지 않으면
    // 응답 순서에 따라 글자가 뒤섞인다 (빠른 연타 시 'pwd' → 'pw'+'d' 등 — 실측).
    let writeChain = Promise.resolve();
    function writeToTerminal(data) {
      if (!ptyId || !connected || closeRequested) return Promise.resolve();
      const sessionAtEnqueue = ptyId;
      writeChain = writeChain
        .then(() => {
          if (ptyId !== sessionAtEnqueue || !connected || closeRequested) return undefined;
          return postTerminal('/terminal/write', { sessionId: ptyId, data });
        })
        .catch(() => {});
      return writeChain;
    }

    function exposeTerminalApi() {
      window.terminalAPI = {
        closeForBoard,
        closeState: () => terminalCloser.snapshot(),
        get ptyId() {
          return ptyId;
        },
        isConnected: () => connected,
        bufferText: () => {
          const buffer = term.buffer.active;
          const lines = [];
          for (let index = 0; index < buffer.length; index += 1) {
            lines.push(buffer.getLine(index)?.translateToString(true) || '');
          }
          return lines.join('\n');
        },
        write: (data) => {
          return writeToTerminal(data);
        },
        focus: () => {
          term.focus();
        },
        paste: (data) => {
          term.paste(String(data ?? ''));
        },
        dataEventCount: () => dataEvents,
        kill: () => {
          if (!ptyId) return Promise.resolve({ ok: true });
          const killPromise = postTerminal('/terminal/kill', { sessionId: ptyId });
          connected = false;
          ptyId = null;
          stopPolling();
          return killPromise;
        },
        resize: (cols, rows) => {
          if (!ptyId || !connected) return Promise.resolve({ ok: false });
          return postTerminal('/terminal/resize', { sessionId: ptyId, cols, rows });
        },
      };
    }

    async function connectBridge() {
      statusEl.textContent = 'Connecting...';
      statusEl.classList.remove('hidden');
      statusEl.style.pointerEvents = 'none';
      statusEl.style.cursor = 'default';
      stopPolling();
      try {
        const result = await postTerminal('/terminal/spawn', {
          shell: '/bin/zsh',
          cols: term.cols,
          rows: term.rows,
        });
        ptyId = result.sessionId;
        connected = true;
        closeRequested = false;
        exitConfirmed = false;
        statusEl.classList.add('hidden');
        try {
          window.parent.postMessage({ type: 'terminal-ready', ptyId }, '*');
        } catch (e) {}
        exposeTerminalApi();
        readTimer = setInterval(readTerminalOutput, 80);
        void readTerminalOutput();
        term.focus();
      } catch (e) {
        connected = false;
        showDisconnected(`Disconnected. ${e.message || 'Click to reconnect.'}`);
        term.write(`\r\n\x1b[31mFailed to spawn PTY: ${e.message}\x1b[0m\r\n`);
      }
    }

    // ---- Terminal input -> PTY ----
    let dataEvents = 0; // 진단용: xterm이 사용자 입력을 인식한 횟수
    term.onData((data) => {
      dataEvents += 1;
      writeToTerminal(data).catch(() => {});
    });

    // 프레임 내부 어디를 클릭해도 xterm으로 포커스 복귀
    // (chrome host의 프레임 포커스 핸드오프는 부모(eg-desk-surface)가 담당)
    window.addEventListener('mousedown', () => {
      setTimeout(() => term.focus(), 0);
    });

    // ---- IME(한글 등) composition → PTY ----
    // 이 chrome-privileged iframe 환경에서는 xterm의 composition 처리가 동작하지
    // 않는다 (commit이 onData로 안 옴 — 실측). 커밋된 문자열(ev.data)을 PTY로
    // 직접 전달하고, xterm이 못 치우는 helper textarea 잔류물을 비운다.
    // 주의: xterm의 composition 경로가 살아나면 이중 전송이 되므로, 그때는
    // 이 포워더를 제거해야 한다 (판별: dataEventCount가 commit 시 증가하는지).
    containerEl.addEventListener('compositionend', (ev) => {
      const committed = ev.data;
      if (committed) writeToTerminal(committed).catch(() => {});
      const ta = containerEl.querySelector('.xterm-helper-textarea');
      if (ta) ta.value = '';
    }, true);

    // ---- Resize handling ----
    let resizeTimeout = null;
    const doResize = () => {
      fitAddon.fit();
      if (ptyId && connected) {
        postTerminal('/terminal/resize', { sessionId: ptyId, cols: term.cols, rows: term.rows }).catch(() => {});
      }
    };

    const ro = new ResizeObserver(() => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(doResize, 50);
    });
    ro.observe(containerEl);

    // ---- Cleanup on unload ----
    window.addEventListener('unload', () => {
      stopPolling();
      if (ptyId) {
        postTerminal('/terminal/kill', { sessionId: ptyId }).catch(() => {});
      }
      try { ro.disconnect(); } catch {}
    });
  })();
  </script>
</body>
</html>

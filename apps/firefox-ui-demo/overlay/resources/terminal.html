<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EG-Desk Terminal</title>
  <link rel="stylesheet" href="chrome://userchrome/content/vendor/xterm.min.css">
  <style>
    /* The host Terminal window owns these values (--egd-terminal-* on
       .egd-terminal-card); egdesk-terminal-init.js copies them in. The
       fallbacks are the same approved dark pair for a page opened alone. */
    :root {
      --egd-terminal-bg: #262925; --egd-terminal-ink: #EDECE7; --egd-terminal-muted: #B5B9AE;
      --egd-terminal-line: #41463F; --egd-terminal-control: #363934; --egd-terminal-control-line: #4A4E47;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: var(--egd-terminal-bg); overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #terminal-toolbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      min-height: 34px; padding: 5px 8px; color: var(--egd-terminal-muted);
      font: 12px system-ui, sans-serif; border-bottom: 1px solid var(--egd-terminal-line);
    }
    #terminal-toolbar select, #terminal-toolbar button {
      color: inherit; background: var(--egd-terminal-control); border: 1px solid var(--egd-terminal-control-line);
      border-radius: 4px; padding: 3px 6px; font: inherit;
    }
    #terminal-toolbar :disabled { opacity: .5; }
    #terminal-shell-label { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #terminal-operation-status { flex: 0 0 auto; padding: 4px 8px; color: #ffbd75; font: 12px system-ui, sans-serif; }
    #terminal-container { flex: 1 1 auto; min-height: 0; width: 100%; padding: 4px; }
    #terminal-container .xterm { height: 100%; }
    #status-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: var(--egd-terminal-ink); font-family: monospace; font-size: 13px;
      text-align: center; pointer-events: none; z-index: 10; max-width: 90%;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="terminal-toolbar">
    <label for="terminal-shell-select">새 터미널의 셸</label>
    <select id="terminal-shell-select" aria-label="새 터미널에서 실행할 셸" disabled></select>
    <button id="terminal-shell-start" type="button" disabled>새 터미널 열기</button>
    <span id="terminal-shell-label" role="status">연결 준비 중</span>
  </div>
  <div id="terminal-operation-status" class="hidden" role="status" aria-live="polite"></div>
  <div id="status-overlay" role="status" aria-live="polite">터미널 연결 중…</div>
  <div id="terminal-container"></div>
  <script src="chrome://userchrome/content/vendor/xterm.min.js"></script>
  <script src="chrome://userchrome/content/vendor/addon-fit.min.js"></script>
  <script src="chrome://userchrome/content/vendor/addon-web-links.min.js"></script>
  <script src="chrome://userchrome/content/egdesk-terminal-init.js"></script>
</body>
</html>

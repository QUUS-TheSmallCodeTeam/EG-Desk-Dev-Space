<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EG-Desk</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9fa; color: #26333d; font-family: system-ui, sans-serif; }
  main { box-sizing: border-box; width: min(100%, 640px); padding: 40px; }
  h1 { margin: 0 0 18px; font-size: clamp(44px, 5vw, 48px); line-height: 1.1; letter-spacing: -.04em; }
  p { margin: 0; color: #586873; }
  .lead { font-size: 19px; line-height: 1.5; }
  .secondary { margin-top: 9px; font-size: 15px; line-height: 1.5; }
</style>
<main>
  <h1>웹에서 시작하세요</h1>
  <p class="lead">위 주소창에 주소나 검색어를 입력하세요.</p>
  <p class="secondary">화면을 축소하면 주변 작업 공간이 보입니다. 열어 둔 웹페이지는 그대로 남습니다.</p>
</main>
</html>
